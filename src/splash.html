<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shahzaib Traders</title>
<style>
:root{--bg:#0d0d0d;--y:#e3d139;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
html,body{margin:0;background:var(--bg)}
body{height:100%;overflow:hidden;display:grid;place-items:center;font-family:system-ui,sans-serif}
#splash{position:relative;display:grid;place-items:center;width:100%;height:100%;transition:opacity .8s ease,transform .8s ease}
#splash.out{opacity:0;transform:scale(1.04)}
.glow{position:absolute;width:60vmin;height:60vmin;border-radius:50%;background:radial-gradient(circle,rgba(227,209,57,.18),transparent 65%);opacity:0;animation:glow 2.4s .2s ease-out forwards}
.lockup{position:relative;display:flex;align-items:center;gap:clamp(12px,2.4vw,26px)}
.markwrap{position:relative;width:clamp(78px,15vmin,130px);aspect-ratio:1}
.markwrap img{position:absolute;inset:6%;width:88%;height:88%;opacity:0;transform:scale(.4) rotate(-90deg);animation:pop .9s .9s cubic-bezier(.2,1.3,.4,1) forwards}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:var(--y);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:302;animation:draw 1s .2s cubic-bezier(.6,0,.2,1) forwards}
.textwrap{position:relative;overflow:hidden;clip-path:inset(0 100% 0 0);animation:wipe .9s 1.5s cubic-bezier(.7,0,.2,1) forwards}
.textwrap img{display:block;height:clamp(52px,10vmin,88px)}
.textwrap::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(227,209,57,.75) 50%,transparent 65%);transform:translateX(-120%);mix-blend-mode:overlay;animation:sweep 1s 2.3s ease-in-out forwards}
#replay{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:none;border:1px solid rgba(255,255,255,.25);color:#bbb;padding:8px 14px;border-radius:20px;font:13px system-ui;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
#replay,#done{display:none!important}
#replay:hover,#replay:focus-visible{color:#fff;border-color:var(--y);outline:none}
#done{position:absolute;color:#777;font:14px system-ui;opacity:0;transition:opacity .6s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes sweep{to{transform:translateX(120%)}}
@keyframes fade{to{opacity:1}}
@keyframes glow{40%{opacity:1}to{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head>
