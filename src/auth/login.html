<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shahzaib Traders - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- Full Screen Shop Signboard Background Layer -->
  <div class="login-bg-layer" style="background-image: url('../../assets/login-bg.png');"></div>
  <div class="login-bg-overlay"></div>

  <!-- Centered Login Container -->
  <div class="login-container" id="loginContainer">
    <div class="auth-card">
      <!-- Logo Header -->
      <div class="logo-header">
        <img src="../../assets/logo-mark.png" alt="Shahzaib Traders Icon" class="logo-mark">
        <img src="../../assets/logo-text.png" alt="Shahzaib Traders" class="logo-text">
      </div>

      <div class="auth-intro">
        <h2 class="auth-title">Enter your PIN</h2>
        <p class="auth-subtitle">Enter your 4-digit security PIN to unlock</p>
      </div>

      <!-- Hidden input for mobile/virtual/physical keyboard accessibility -->
      <input 
        type="password" 
        id="hiddenPinInput" 
        class="sr-only" 
        maxlength="4" 
        inputmode="numeric" 
        pattern="[0-9]*" 
        autocomplete="off" 
        aria-label="Enter 4-digit PIN"
        autofocus
      />

      <!-- 4 Digit PIN Masked Indicator Boxes -->
      <div class="pin-display" id="pinDisplay" role="group" aria-label="PIN digits entered">
        <div class="pin-box" data-index="0" aria-label="Digit 1">
          <span class="pin-dot"></span>
        </div>
        <div class="pin-box" data-index="1" aria-label="Digit 2">
          <span class="pin-dot"></span>
        </div>
        <div class="pin-box" data-index="2" aria-label="Digit 3">
          <span class="pin-dot"></span>
        </div>
        <div class="pin-box" data-index="3" aria-label="Digit 4">
          <span class="pin-dot"></span>
        </div>
      </div>

      <!-- Feedback Message Area -->
      <div class="feedback-area" id="feedbackArea" role="alert" aria-live="polite">
        <span class="error-msg" id="errorMsg">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Wrong PIN
        </span>
      </div>

      <!-- On-Screen Numeric Keypad -->
      <div class="numpad" role="group" aria-label="PIN On-Screen Keypad">
        <button type="button" class="num-btn" data-key="1">1</button>
        <button type="button" class="num-btn" data-key="2">2</button>
        <button type="button" class="num-btn" data-key="3">3</button>
        
        <button type="button" class="num-btn" data-key="4">4</button>
        <button type="button" class="num-btn" data-key="5">5</button>
        <button type="button" class="num-btn" data-key="6">6</button>
        
        <button type="button" class="num-btn" data-key="7">7</button>
        <button type="button" class="num-btn" data-key="8">8</button>
        <button type="button" class="num-btn" data-key="9">9</button>
        
        <button type="button" class="num-btn action-btn clear-btn" data-key="clear" title="Clear entered digits" aria-label="Clear">
          <span>C</span>
        </button>
        <button type="button" class="num-btn" data-key="0">0</button>
        <button type="button" class="num-btn action-btn backspace-btn" data-key="backspace" title="Delete last digit" aria-label="Backspace">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
      </div>

      <div class="auth-helper">
        <span>Use keyboard numbers or click the keypad</span>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
